name: Build and Release All Extensions

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-extensions
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Executable
        run: chmod +x gradlew

      # --continue keeps building modules that don't depend on the failed task;
      # continue-on-error lets the release steps below still run
      - name: Build All Sub-Modules
        id: build
        continue-on-error: true
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
        run: ./gradlew buildVeenaPlugin --continue --parallel --build-cache

      - name: Determine Next Semantic Version
        id: tag_version
        run: |
          LATEST_TAG=$(git ls-remote --tags --refs origin 'v[0-9]*.[0-9]*.[0-9]*' \
            | awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -n1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Generated tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Assemble Release Files and Catalog
        id: assemble
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist prev
          : > built.txt
          : > carried.txt

          # 1. Freshly built packages, named by the id in their own manifest
          while IFS= read -r -d '' f; do
            id=$(unzip -p "$f" assets/manifest.json 2>/dev/null | jq -r '.id // empty' 2>/dev/null || true)
            if [[ ! "$id" =~ ^[a-z0-9_]+$ ]]; then
              echo "::warning::$f has a missing/invalid manifest id, ignoring it"
              continue
            fi
            [ "$(basename "$f" .veena)" = "$id" ] || echo "::notice::Renaming $(basename "$f") -> $id.veena"
            cp "$f" "dist/$id.veena"
            echo "$id" >> built.txt
          done < <(find . \( -path ./dist -o -path ./prev \) -prune -o \
                     -path '*/build/veena/*.veena' -type f -print0)

          if [ ! -s built.txt ]; then
            echo "::warning::No plugins were built, skipping release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Previous release packages
          PREV_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            gh release download "$PREV_TAG" --dir prev --pattern '*.veena' || true
          fi

          # 3. Carry over plugins that were not rebuilt (failed modules)
          for f in prev/*.veena; do
            id=$(basename "$f" .veena)
            if [ ! -f "dist/$id.veena" ]; then
              cp "$f" "dist/$id.veena"
              echo "$id" >> carried.txt
              echo "::warning::$id failed to build, carried over from $PREV_TAG"
            fi
          done

          # 4. catalog.json in the app's CatalogExtensionItem format
          for f in dist/*.veena; do
            id=$(basename "$f" .veena)
            m=$(unzip -p "$f" assets/manifest.json)
            bytes=$(stat -c%s "$f")
            size=$(awk -v b="$bytes" 'BEGIN{ if (b>=1048576) printf "%.2f MB", b/1048576; else printf "%d KB", b/1024 }')
            jq -nc --argjson m "$m" --arg id "$id" --arg size "$size" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${id}.veena" '
              {
                id: $id,
                name: ($m.name // $id),
                version: ($m.version // ""),
                versionCode: ($m.versionCode // 0),
                downloadUrl: $url,
                iconUrl: ($m.iconUrl // ""),
                description: ($m.description // ""),
                author: ($m.author // "Community"),
                isOfficial: false,
                size: $size,
                capabilities: ($m.capabilities // [])
              }'
          done | jq -s 'sort_by(.id)' > dist/catalog.json

          (cd dist && sha256sum *.veena > checksums.txt)

          # Everything needed for the release is ready, so flag publish now
          echo "publish=true" >> "$GITHUB_OUTPUT"

          # 5. Job summary (cosmetic, must never block the release)
          {
            echo "### Extensions"
            echo "| id | status | version | versionCode |"
            echo "|----|--------|---------|-------------|"
            jq -r --rawfile built built.txt '
              ($built | split("\n") | map(select(length > 0))) as $b
              | .[]
              | .id as $id
              | "| \($id) | \(if ($b | index($id)) != null then "built" else "carried-over" end) | \(.version) | \(.versionCode) |"
            ' dist/catalog.json
          } >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not write job summary"

          cat dist/catalog.json

      - name: Publish Release
        if: steps.assemble.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.veena
            dist/catalog.json
            dist/checksums.txt
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          generate_release_notes: true
          make_latest: true

      # Runs even if an earlier step failed; marks the run red after publishing
      - name: Fail Job if Any Module Failed
        if: ${{ always() && steps.build.outcome == 'failure' }}
        run: |
          echo "::error::One or more extensions failed to build. Release was still published with successful builds; failed ones were carried over."
          exit 1